# Taken from https://jsr.io/docs/publishing-packages#publishing-from-github-actions
# And also: https://docs.npmjs.com/trusted-publishers#step-2-configure-your-cicd-workflow
name: Publish to NPM and JSR

on:
  workflow_dispatch:
jobs:
  publish-jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC ID token is used for authentication with JSR and NPM.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Set up Deno
        uses: denoland/setup-deno@ff4860f9d7236f320afa0f82b7e6457384805d05 # v2.0.4
        with:
          deno-version: 2.7.14
      - name: Install Dependencies
        run: deno install --frozen
      - name: Publish to JSR
        run: npx --yes jsr@0.14.3 publish
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC ID token is used for authentication with JSR and NPM.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Separately tested on every commit.
      - name: Run Tests
        run: npm run node-test
      # This works with no credentials because I have configured trusted
      # publishers in npmjs.com under this package's settings.
      - name: Publish to NPM
        run: npm publish --provenance
  publish-github:
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-jsr]
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Get Version
        run: echo "VERSION=$(node -p "require('./deno.json').version")" >> "$GITHUB_ENV"
      - name: Create Git Tag
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
      - name: Extract release notes
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3.1.0
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.extract-release-notes.outputs.release_notes }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "${NOTES}"
